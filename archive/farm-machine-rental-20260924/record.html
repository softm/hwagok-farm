</head><body><h1 data-record-title><span class="record-date">작성일 미확인</span> <span>관리기 임대·출고</span></h1><p>아세아 관리기 임대, 출고, 운송 및 현장 크레인 하차 기록.</p><h2>이용조건</h2><p>관내 농업인 · 농업경영체등록증 · NH농업인안전보험 확인 · 1농가 1대 · 3일 이내 · 안전교육 · 세척 및 연료 보충 후 반납.</p><h2>현장 기록</h2><p>사업소 방문 → 관리기 확인 → 조작 설명 → 출고 → 운송차량 적재 → 현장 운송 → 크레인 하차 → 상태 확인.</p><h2>자료</h2><p>사진 18장, 동영상 2개.</p></body></html>
