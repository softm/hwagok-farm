</style></head><body><main><nav><a href="../">← 화곡농장 아카이브</a></nav><header><p class="meta">방제·작업기록</p><h1>2026-08-11 단골 들깨밭 살포</h1><p>농막 아래 들깨밭 고랑 잡초를 대상으로 단골을 선택 살포한 기록입니다.</p></header><section><h2>살포 기록</h2><table><tr><th>장소</th><td>화곡농장 농막 아래 농지</td></tr><tr><th>작물</th><td>들깨</td></tr><tr><th>총 살포액</th><td>20L × 2통 = 40L</td></tr><tr><th>방식</th><td>차폐갓 장착 · 고랑 선택 살포</td></tr></table></section><section><h2>라벨 기준</h2><p>물 20L당 약제 100mL 기준이며, 40L 환산값은 200mL입니다. 실제 투입 약제량은 별도 확인되지 않았으므로 환산값과 실제값을 구분합니다.</p></section><footer class="footer"><a href="../">화곡농장 홈</a><a href="https://softm.github.io/projects/hwagok-farm/">프로젝트 목차</a><a href="https://softm.github.io/projects/">전체 프로젝트</a></footer></main></body></html>
