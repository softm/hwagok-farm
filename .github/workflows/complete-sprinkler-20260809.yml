name: Complete requested sprinkler archive
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/complete-sprinkler-20260809.yml'
      - 'scripts/complete_sprinkler_20260809.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: archive-inbox
  cancel-in-progress: false
jobs:
  complete-request:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing archive verification dependencies
        run: python -m pip install -r scripts/archive-requirements.txt
      - name: Preserve only the requested source HTML and its original files
        run: |
          python -m py_compile scripts/complete_sprinkler_20260809.py
          python scripts/complete_sprinkler_20260809.py build
          python scripts/audit_archive_public.py
      - name: Commit verified record and service catalogue without deleting input
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- public/records/20260809-sprinkler-piping-plan index.html
          test -z "$(git diff --cached --name-only --diff-filter=D)"
          if ! git diff --cached --quiet; then
            git commit -m 'archive: preserve 20260809 sprinkler HTML MD and 32 original PNGs'
            git push origin HEAD:main
          fi
          SHA="$(git rev-parse HEAD)"
          gh workflow run deploy-static-pages.yml --repo "$GITHUB_REPOSITORY" --ref main -f source_sha="$SHA"
          RUN_ID=''
          for attempt in $(seq 1 30); do
            RUN_ID="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow deploy-static-pages.yml --event workflow_dispatch --limit 20 --json databaseId,headSha --jq ".[] | select(.headSha == \"$SHA\") | .databaseId" | head -1)"
            test -z "$RUN_ID" || break
            sleep 5
          done
          test -n "$RUN_ID"
          gh run watch "$RUN_ID" --repo "$GITHUB_REPOSITORY" --exit-status
      - name: Install real browser
        run: python -m playwright install --with-deps chromium
      - name: Verify original bytes, all PNGs, zoom, mobile and service navigation
        run: python scripts/complete_sprinkler_20260809.py live
      - name: Wait for separately committed central registration without exposing private sources
        run: |
          python - <<'PY'
          import json,time
          from urllib.request import Request,urlopen
          expected='https://softm.github.io/hwagok-farm/records/20260809-sprinkler-piping-plan/'
          for attempt in range(80):
              try:
                  req=Request('https://softm.github.io/projects/projects.json?verify-sprinkler='+str(time.time_ns()),headers={'Cache-Control':'no-cache'})
                  with urlopen(req,timeout=30) as r:data=json.load(r)
                  project=next(p for p in data['projects'] if p['repo']=='hwagok-farm')
                  if any(x.get('url')==expected for x in project.get('links',[])):
                      print('Central registration exists; actual rendering is checked next.');break
              except Exception as error:print(type(error).__name__)
              time.sleep(15)
          else:raise SystemExit('Central update not verified; inbox retained')
          PY
      - name: Require actual project home and entire projects browser rendering
        run: python scripts/complete_sprinkler_20260809.py final
      - name: Clean only the exact unchanged input after every completion gate passes
        run: python scripts/complete_sprinkler_20260809.py cleanup
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sprinkler-20260809-completion-evidence
          path: .archive-run/sprinkler-20260809/
          include-hidden-files: true
          if-no-files-found: warn
