name: Publish mowing record 20260907
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-mowing-20260907.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish-mowing-20260907
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify the public-only publication bundle
        env:
          BUNDLE_URL: https://at.adobe.com/3rMdXpBPLgzoi6dz
        run: |
          curl --fail --location --retry 2 --max-time 180 "$BUNDLE_URL" --output /tmp/mowing-20260907.zip
          echo '3ece0a2e51ed0fe7a5890eae0de27b33f2206dd18a5c1b7f5c9aea970e3e0080  /tmp/mowing-20260907.zip' | sha256sum --check
      - name: Install documents and update only the farm navigation
        shell: python
        run: |
          import hashlib, json, zipfile
          from pathlib import Path
          target = Path('public/mowing-20260907')
          allowed = {'README.md','gallery.js','images/01-slope.jpg','images/02-path.jpg','images/03-field.jpg','index.html','manifest.json','record.md','styles.css','20260907_화곡농장_벌초작업_공개.zip'}
          with zipfile.ZipFile('/tmp/mowing-20260907.zip') as z:
              assert set(z.namelist()) == allowed, 'Unexpected archive contents'
              assert sum(i.file_size for i in z.infolist()) < 20000000
              assert z.testzip() is None
              for name in allowed:
                  dest = target / name
                  dest.parent.mkdir(parents=True, exist_ok=True)
                  dest.write_bytes(z.read(name))
          manifest = json.loads((target/'manifest.json').read_text())
          assert manifest['elapsed_minutes'] == 510 and len(manifest['photos']) == 3
          for photo in manifest['photos']:
              assert hashlib.sha256((target/photo['public_file']).read_bytes()).hexdigest() == photo['sha256']
          page_path = Path('app/page.tsx')
          page = page_path.read_text()
          if '/mowing-20260907/' not in page:
              assert 'const chats = [\n' in page
              card = '''  {
              href: "/mowing-20260907/",
              kind: "벌초·작업기록",
              title: "2026-09-07 화곡농장 벌초 작업 기록",
              description: "08:30부터 17:00까지의 벌초·풀베기 기록입니다. 휴게시간 차감 전 8시간 30분이며, 현장 사진 3장과 MD·HTML·ZIP을 함께 정리했습니다.",
              meta: ["08:30~17:00", "휴게시간 차감 전 8시간 30분", "현장 사진 3장"],
            },
          '''
              page = page.replace('const chats = [\n', 'const chats = [\n'+card, 1)
          page = page.replace('2026. 8. 31.', '2026. 9. 7.')
          page = page.replace('https://hwagok.softm.chatgpt.site/#hwagok', 'https://hwagok-farm-private.vercel.app/')
          page_path.write_text(page)
          nav_path = Path('app/project-nav.tsx')
          nav = nav_path.read_text()
          if '/mowing-20260907/' not in nav:
              assert 'type Current = ' in nav and 'const chats = [\n' in nav
              nav = nav.replace('type Current = ', 'type Current = "mowing" | ', 1)
              nav = nav.replace('const chats = [\n', 'const chats = [\n  { id: "mowing" as Current, href: "/mowing-20260907/", kind: "벌초·작업기록", title: "2026-09-07 화곡농장 벌초 작업 기록", meta: "08:30~17:00·현장 사진 3장·MD·HTML·ZIP" },\n', 1)
          if '/perilla-transplant-20260830' not in nav:
              nav = nav.replace('type Current = ', 'type Current = "perillaTransplant" | ', 1)
              existing = '  { id: "perillaTransplant" as Current, href: "/perilla-transplant-20260830", kind: "재배·작업기록", title: "2026-08-30 663-1·667-35 들깨 정식", meta: "들깨 모종 3판·구획 표시·농관원 현장확인" },\n'
              nav = nav.replace('  { id: "perilla" as Current', existing+'  { id: "perilla" as Current', 1)
          nav = nav.replace('https://hwagok.softm.chatgpt.site/#hwagok', 'https://hwagok-farm-private.vercel.app/')
          nav_path.write_text(nav)
          assert '/mowing-20260907/' in page_path.read_text()
          print('Imported 3 sanitized photos, MD, HTML, ZIP; updated farm home and navigation.')
      - name: Commit the public files to the existing repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/mowing-20260907 app/page.tsx app/project-nav.tsx
          if ! git diff --cached --quiet; then
            git commit -m 'docs: publish 2026-09-07 farm mowing record with 3 redacted photos'
            git push origin HEAD:main
          fi
