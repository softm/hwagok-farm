name: Manual-start immediate HTTP check
on:
  push:
    branches: [main]
    paths: ['.github/workflows/manual-start-http-check.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check actual public responses
        run: |
          python3 -u - <<'PY'
          import concurrent.futures,json,urllib.request,urllib.error
          urls=[
           'https://softm.github.io/hwagok-farm/archive/cultivator-manual-start-20260922/image_manifest.json',
           'https://softm.github.io/hwagok-farm/archive/cultivator-manual-start-20260922/record.html',
           'https://softm.github.io/projects/projects.json',
           'https://softm.github.io/projects/',
           'https://api.github.com/repos/softm/softm.github.io/pages',
           'https://api.github.com/repos/softm/hwagok-farm/pages'
          ]
          def check(url):
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'Hwagok-public-check','Cache-Control':'no-cache'})
                  with urllib.request.urlopen(req,timeout=20) as r:
                      data=r.read()
                      print(json.dumps({'url':url,'status':r.status,'bytes':len(data),'manualStartPresent':b'cultivator-manual-start-20260922' in data,'sample':data[:300].decode('utf-8','replace')},ensure_ascii=False),flush=True)
              except urllib.error.HTTPError as e:
                  print(json.dumps({'url':url,'status':e.code,'body':e.read().decode('utf-8','replace')[:600]}),flush=True)
              except Exception as e:
                  print(json.dumps({'url':url,'error':repr(e)}),flush=True)
          with concurrent.futures.ThreadPoolExecutor(max_workers=6) as pool:
              list(pool.map(check,urls))
          PY
