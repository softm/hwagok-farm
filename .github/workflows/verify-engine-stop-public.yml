name: Verify engine-stop public archive

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-engine-stop-public.yml'
      - 'scripts/prepare-engine-stop.mjs'
      - 'public/archive/asea-engine-stop-20260922/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-engine-stop-public
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Check deployed pages, registry link, and actual media status
        shell: python
        run: |
          import hashlib, json, os, time, urllib.request
          from urllib.parse import urlsplit

          root = 'https://softm.github.io/hwagok-farm/'
          slug = 'asea-engine-stop-20260922'
          base = root + 'archive/' + slug + '/'
          image_names = ['01-main-clutch-off.png', '02-rotary-clutch-off.png', '03-throttle-low.png', '04-travel-gear-neutral.png', '05-tilling-gear-neutral.png', '06-manual-stop-switch.png', '07-electric-key-off.png']
          expected_hashes = ['f78208b916975ff8c8ee5378708436ac6c33c3a9631d07379237aa93eafc842a', '9a9a40e6fcfd78137ee36a1f69d1f0b6abc56e95464d0f7d2a0dd08c37cec104', '7d97037ba480fd673fcd9baa90b03cb77b9a1242c168d48fa02bc48c7950d6ab', '11cb34351b05da6a37a0cf7921985abfb664ea584caec625c9c7e4a8e1b473eb', 'fb925dc7a1fc4be98d90e2b5bf4d1fd53a8c566ee1d4a63b99e07aad575e6a3f', 'f224caffa3aecdaddc26fadcc13374b8bc07d4750ab9c082031c685b150d481e', '230fab66234fe4aa9e1c7ef60d95a56ff553faa346650a51d494fa9c78af798b']
          expected_zip = '54b16715901581fd10e04b77e184fa05c53faa0041ebd29ddd8d25ea3261c84f'

          def get(url):
              request = urllib.request.Request(url + '?verify=' + str(time.time_ns()), headers={'User-Agent': 'Hwagok-Archive-Verification', 'Cache-Control': 'no-cache'})
              with urllib.request.urlopen(request, timeout=20) as response:
                  assert response.status == 200, (url, response.status)
                  assert urlsplit(response.url).hostname == 'softm.github.io', response.url
                  data = response.read()
                  print('HTTP 200', url, len(data), 'bytes', flush=True)
                  return data

          last_error = None
          for attempt in range(12):
              try:
                  html = get(base + 'record.html').decode('utf-8')
                  assert '아세아 관리기 엔진 정지' in html
                  detail = get(base).decode('utf-8')
                  assert '아세아 관리기 엔진 정지' in detail
                  home = get(root).decode('utf-8')
                  assert '/archive/' + slug + '/' in home
                  status = json.loads(get(base + 'status.json'))
                  assert status['expectedImages'] == 7
                  directory = json.loads(get('https://softm.github.io/projects/projects.json'))
                  farm = next(p for p in directory['projects'] if p['repo'] == 'hwagok-farm')
                  assert any(link['url'] == base for link in farm['links']), 'Global directory link is not deployed yet'
                  get('https://softm.github.io/projects/')
                  if status['publishedImages'] == 7:
                      assert hashlib.sha256(get(base + 'source.zip')).hexdigest() == expected_zip
                      for name, digest in zip(image_names, expected_hashes):
                          assert hashlib.sha256(get(base + 'images/' + name)).hexdigest() == digest, name
                      message = 'Original-media complete: 7 PNG files and ZIP verified over public HTTP.'
                  else:
                      assert status['publishedImages'] == 0
                      assert status['status'] == 'media-upload-pending'
                      assert '사진 7장과 원본 ZIP은 아직 서버에 올라오지 않았습니다.' in html
                      message = 'TEXT ONLY: public pages and both directory links verified. Published images: 0/7. Original ZIP upload still required.'
                      print('::warning::' + message, flush=True)
                  print('VERIFICATION RESULT:', message, flush=True)
                  with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
                      summary.write('## Engine-stop public archive\n\n' + message + '\n\n' + base + '\n\nhttps://softm.github.io/projects/\n')
                  break
              except Exception as error:
                  last_error = error
                  print('Waiting for Pages propagation:', type(error).__name__, str(error), flush=True)
                  if attempt == 11:
                      raise
                  time.sleep(15)
