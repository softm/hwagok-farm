name: Deploy static GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: github-pages-deploy
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Assemble static site from current directory units only
        run: |
          set -euo pipefail
          rm -rf site
          mkdir site
          cp -a public/. site/
          cp index.html archive-static.css archive-static.js site/
          touch site/.nojekyll
          echo "Published directory units:"
          find public -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort
      - name: Publish static files
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./site
          keep_files: false
