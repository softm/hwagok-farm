name: Deploy static GitHub Pages
run-name: Deploy static archive ${{ inputs.source_sha || github.sha }}
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact committed archive revision to deploy
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: github-pages-deploy
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    outputs:
      source_sha: ${{ steps.settings.outputs.source_sha }}
      build_type: ${{ steps.settings.outputs.build_type }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          fetch-depth: 0
      - name: Check public/private scope before publication
        run: python3 scripts/audit_archive_public.py
      - name: Inspect existing Pages mode and reject stale source
        id: settings
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          gh api "repos/$GITHUB_REPOSITORY/pages" > .archive-run/pages-settings.json
          python3 - <<'PY'
          import json,os,subprocess
          data=json.load(open('.archive-run/pages-settings.json'))
          kind=data['build_type']
          assert kind in ('legacy','workflow'), 'Unknown Pages publishing mode'
          if kind=='legacy':
              assert data['source']['branch']=='gh-pages' and data['source']['path']=='/', 'Existing Pages source differs; do not change settings automatically'
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              out.write('build_type='+kind+'\n')
              out.write('source_sha='+subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()+'\n')
          PY
      - name: Assemble existing public archive structure only
        run: |
          set -euo pipefail
          rm -rf site
          mkdir site
          if [ -d public ]; then cp -a public/. site/; fi
          python3 - <<'PY'
          import json, shutil
          from pathlib import Path
          cfg=Path('.archive-public-excludes.json')
          data=json.loads(cfg.read_text(encoding='utf-8')) if cfg.is_file() else {'records':[]}
          for slug in data.get('records',[]):
              target=Path('site/records')/slug
              if target.exists():
                  shutil.rmtree(target)
          PY
          cp index.html archive-static.css archive-static.js site/
          touch site/.nojekyll
      - uses: actions/upload-artifact@v4
        if: steps.settings.outputs.build_type == 'legacy'
        with:
          name: prepared-public-site
          path: site/
          include-hidden-files: true
      - uses: actions/upload-pages-artifact@v3
        if: steps.settings.outputs.build_type == 'workflow'
        with:
          path: site
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-deployment-scope
          path: .archive-run/*.json
          include-hidden-files: true
          if-no-files-found: warn
  publish-existing-branch:
    needs: prepare
    if: needs.prepare.outputs.build_type == 'legacy'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: prepared-public-site
          path: site
      - name: Reject a source revision superseded by a concurrent upload
        run: |
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
      - name: Synchronize existing publishing branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./site
          keep_files: false
      - name: Request native Pages build using existing branch and protection rules
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api -X POST "repos/$GITHUB_REPOSITORY/pages/builds" > /tmp/pages-build.json
          BUILD_ID="$(python3 -c 'import json;print(json.load(open("/tmp/pages-build.json"))["url"].rstrip("/").split("/")[-1])')"
          for attempt in $(seq 1 60); do
            STATUS="$(gh api "repos/$GITHUB_REPOSITORY/pages/builds/$BUILD_ID" --jq '.status')"
            if [ "$STATUS" = built ]; then exit 0; fi
            if [ "$STATUS" = errored ]; then echo 'Pages build failed'; exit 1; fi
            sleep 10
          done
          echo 'Pages build verification timed out'; exit 1
  deploy-protected-pages:
    needs: prepare
    if: needs.prepare.outputs.build_type == 'workflow'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: https://softm.github.io/hwagok-farm/
    steps:
      - uses: actions/deploy-pages@v4
