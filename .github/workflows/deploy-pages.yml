name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    outputs:
      pages_mode: ${{ steps.pages_mode.outputs.build_type }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import verified deodeok archive bundle when present
        if: ${{ hashFiles('deodeok-20260923-complete.zip') != '' }}
        run: |
          python3 scripts/import-deodeok-bundle.py
          git add public/archive/deodeok-harvest-20260923 archive/records.ts
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Archive verified deodeok originals, documents and ZIP'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build

      - name: Verify imported archive is present in static output
        if: ${{ hashFiles('public/archive/deodeok-harvest-20260923/import-receipt.json') != '' }}
        run: |
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('out/archive/deodeok-harvest-20260923')
          record=json.loads((root/'record.json').read_text())
          for item in record['media']:
              data=(root/item['file']).read_bytes()
              assert hashlib.sha256(data).hexdigest()==item['sha256'],item['file']
          assert (root/'bundle.zip').is_file()
          assert (root/'record.html').is_file()
          print('Static output includes 7 original photos, 3 original videos, HTML, MD and ZIP.')
          PY

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./out
          keep_files: true

      - name: Request actual Pages publication using the existing source
        id: pages_mode
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/request-pages-rebuild.py

      - name: Upload static Pages artifact for Actions-based sites
        if: steps.pages_mode.outputs.build_type == 'workflow'
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./out

      - name: Verify public archive, original assets and project directory
        if: steps.pages_mode.outputs.build_type != 'workflow'
        run: python3 scripts/verify-deodeok-public.py

      - name: Save public verification results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deodeok-public-verification
          path: deodeok-public-verification.json
          if-no-files-found: warn

  deploy-workflow-pages:
    needs: build-and-deploy
    if: needs.build-and-deploy.outputs.pages_mode == 'workflow'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Deploy static Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Download the exact published build for verification
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: pages-artifact
      - name: Restore verification files from the build artifact
        run: |
          mkdir -p out
          tar -xf pages-artifact/artifact.tar -C out
      - name: Verify public archive, original assets and project directory
        run: python3 scripts/verify-deodeok-public.py
      - name: Save public verification results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deodeok-public-verification-live
          path: deodeok-public-verification.json
          if-no-files-found: warn
