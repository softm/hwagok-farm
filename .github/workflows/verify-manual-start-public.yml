name: Verify manual-start public archive
on:
  push:
    branches: [main]
    paths: ['.github/workflows/verify-manual-start-public.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check published guide and every image
        run: |
          python3 -u - <<'PY'
          import hashlib,io,json,re,time,urllib.request,zipfile
          root='https://softm.github.io/hwagok-farm/archive/cultivator-manual-start-20260922/'
          def get(url):
              req=urllib.request.Request(url,headers={'Cache-Control':'no-cache','User-Agent':'HwagokArchiveCheck/1.0'})
              with urllib.request.urlopen(req,timeout=45) as r:
                  assert r.status==200,(url,r.status)
                  return r.read()
          for attempt in range(20):
              try:
                  manifest=json.loads(get(root+'image_manifest.json'))
                  assert len(manifest['media'])==10
                  for item in manifest['media']:
                      data=get(root+item['file'])
                      assert data.startswith(b'\x89PNG\r\n\x1a\n')
                      assert hashlib.sha256(data).hexdigest()==item['sha256'],item['file']
                      print('IMAGE VERIFIED',item['file'],len(data),flush=True)
                  page=get(root+'record.html').decode()
                  assert len(re.findall(r'<img src="images/',page))==10
                  assert '시동 후에는 초크를 열림' in page
                  assert 'POKGZK2ds34' in page
                  assert '웹 최적화본' in page
                  md=get(root+'record.md').decode()
                  assert len(re.findall(r'!\[',md))==10
                  with zipfile.ZipFile(io.BytesIO(get(root+'manual-start-20260922-web.zip'))) as z:
                      assert 'index.html' in z.namelist() and 'record.md' in z.namelist()
                      assert len([n for n in z.namelist() if n.startswith('images/') and n.endswith('.png')])==10
                      for item in manifest['media']:
                          assert hashlib.sha256(z.read(item['file'])).hexdigest()==item['sha256']
                  home=get('https://softm.github.io/hwagok-farm/').decode()
                  assert 'cultivator-manual-start-20260922' in home
                  get(root)
                  print('GUIDE VERIFIED: HTML, Markdown, ZIP, 10 PNG hashes, archive detail and farm home.',flush=True)
                  print('FARM CARD COUNT',len(re.findall(r'<article[^>]*class="chat-card"',home)),flush=True)
                  break
              except Exception as exc:
                  print('Waiting for public guide',attempt+1,repr(exc),flush=True)
                  time.sleep(15)
          else:
              raise RuntimeError('Live manual-start guide verification failed')
          for attempt in range(25):
              try:
                  obj=json.loads(get('https://softm.github.io/projects/projects.json?manual-start='+str(int(time.time()))))
                  farm=next(p for p in obj['projects'] if p.get('repo')=='hwagok-farm')
                  assert any('cultivator-manual-start-20260922' in x.get('url','') for x in farm.get('links',[]))
                  get('https://softm.github.io/projects/')
                  print('DIRECTORY VERIFIED: https://softm.github.io/projects/ ; manual-start link present.',flush=True)
                  break
              except Exception as exc:
                  print('Waiting for central directory',attempt+1,repr(exc),flush=True)
                  time.sleep(15)
          else:
              raise RuntimeError('Guide is live but central directory is not updated')
          PY
