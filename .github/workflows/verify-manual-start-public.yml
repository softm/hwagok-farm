name: Verify manual-start public archive
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-manual-start-public.yml'
      - 'public/archive/cultivator-manual-start-20260922/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify live HTML, ten images, ZIP and both indexes
        run: |
          python3 -u - <<'PY'
          import hashlib,io,json,re,struct,time,urllib.request,zipfile
          from pathlib import Path
          from datetime import datetime,timezone
          root='https://softm.github.io/hwagok-farm/archive/cultivator-manual-start-20260922/'
          checks=[]
          def get(url):
              request=urllib.request.Request(url,headers={'Cache-Control':'no-cache','User-Agent':'ManualStartPublicationCheck/2.0'})
              with urllib.request.urlopen(request,timeout=25) as response:
                  assert response.status==200,(url,response.status)
                  data=response.read()
                  checks.append({'url':url,'status':response.status,'bytes':len(data)})
                  return data
          try:
              manifest=json.loads(get(root+'image_manifest.json'))
              assert manifest['expectedImages']==manifest['publishedImages']==10
              assert len(manifest['media'])==10
              for item in manifest['media']:
                  image=get(root+item['file'])
                  assert image.startswith(b'\x89PNG\r\n\x1a\n'),item['file']
                  assert struct.unpack('>II',image[16:24])==(959,544),item['file']
                  assert hashlib.sha256(image).hexdigest()==item['sha256'],item['file']
                  print('IMAGE VERIFIED',item['file'],len(image),flush=True)
              page=get(root+'record.html').decode()
              assert len(re.findall(r'<img src="images/',page))==10
              assert '시동 후에는 초크를 열림' in page and 'POKGZK2ds34' in page
              assert '웹 최적화본' in page
              md=get(root+'record.md').decode()
              assert len(re.findall(r'!\[',md))==10
              bundle=get(root+'manual-start-20260922-web.zip')
              with zipfile.ZipFile(io.BytesIO(bundle)) as z:
                  assert z.testzip() is None
                  assert {'index.html','record.html','record.md','image_manifest.json'}.issubset(z.namelist())
                  assert len([n for n in z.namelist() if n.startswith('images/') and n.endswith('.png')])==10
                  for item in manifest['media']:
                      assert hashlib.sha256(z.read(item['file'])).hexdigest()==item['sha256'],item['file']
              farm=get('https://softm.github.io/hwagok-farm/').decode()
              assert 'cultivator-manual-start-20260922' in farm
              detail=get(root).decode()
              assert '수동 시동' in detail
              directory=None
              for attempt in range(16):
                  try:
                      directory=json.loads(get('https://softm.github.io/projects/projects.json?manual-start='+str(time.time_ns())))
                      entry=next(p for p in directory['projects'] if p.get('repo')=='hwagok-farm')
                      assert any(x.get('url')==root for x in entry.get('links',[])),'Manual-start link absent from live central directory'
                      get('https://softm.github.io/projects/')
                      break
                  except Exception as error:
                      print('DIRECTORY WAIT',attempt+1,repr(error),flush=True)
                      if attempt==15: raise
                      time.sleep(15)
              result={'status':'passed','checkedAtUTC':datetime.now(timezone.utc).isoformat(),'guideUrl':root,'htmlUrl':root+'record.html','images':10,'imageType':'web-optimized derivatives, not byte-identical originals','allImageHashesVerified':True,'zipVerified':True,'markdownVerified':True,'chokeCorrectionVerified':True,'farmHomeVerified':True,'centralDirectoryVerified':True,'farmArchiveCardCount':len(re.findall(r'<article[^>]*class="chat-card"',farm)),'httpChecks':checks}
              Path('manual-start-verification.json').write_text(json.dumps(result,ensure_ascii=False,indent=2)+'\n')
              print('PUBLICATION VERIFIED',json.dumps(result,ensure_ascii=False),flush=True)
          except Exception as error:
              result={'status':'failed','error':repr(error),'httpChecks':checks}
              Path('manual-start-verification.json').write_text(json.dumps(result,ensure_ascii=False,indent=2)+'\n')
              raise
          PY
      - name: Save publication verification receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manual-start-publication-verification
          path: manual-start-verification.json
          retention-days: 30
