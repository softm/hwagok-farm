name: Refresh mowing gallery archive
on:
  push:
    branches: [main]
    paths: ['.github/workflows/refresh-mowing-20260907.yml']
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch verified public correction bundle
        run: |
          curl --fail --location --retry 2 --max-time 120 'https://at.adobe.com/RQCupKcIOW8iLX1B' -o /tmp/mowing-gallery-fix.zip
          echo '763796ff7e78c107310e4488e5416b8308c04162e0c22199126174196fce876d  /tmp/mowing-gallery-fix.zip' | sha256sum --check
      - name: Update only stylesheet and matching user archive
        shell: python
        run: |
          from pathlib import Path
          import zipfile
          target = Path('public/mowing-20260907')
          with zipfile.ZipFile('/tmp/mowing-gallery-fix.zip') as z:
              assert set(z.namelist()) == {'styles.css', '20260907_화곡농장_벌초작업_공개.zip'}
              assert z.testzip() is None
              for name in z.namelist():
                  (target/name).write_bytes(z.read(name))
          assert '.photo img{display:block;width:100%;height:auto;' in (target/'styles.css').read_text()
      - name: Commit matching page and ZIP
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/mowing-20260907/styles.css public/mowing-20260907/*.zip
          if ! git diff --cached --quiet; then
            git commit -m 'fix: preserve landscape gallery image ratio and refresh publication ZIP'
            git push origin HEAD:main
          fi
